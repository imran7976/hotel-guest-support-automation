version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: hotel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hotel_root_secure_pass_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_guest_support}
      MYSQL_USER: ${MYSQL_USER:-hotel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_secure_pass_2025}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-hotel_root_secure_pass_2025}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-hotel_user}:${MYSQL_PASSWORD:-hotel_secure_pass_2025}@mysql:3306/${MYSQL_DATABASE:-hotel_guest_support}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.75}
      - N8N_WEBHOOK_URL_BASE=http://n8n:5678/webhook
      - N8N_WEBHOOK_AUTH_TOKEN=${N8N_WEBHOOK_AUTH_TOKEN:-hotel_n8n_secure_token_xyz987}
      - N8N_ENABLED=true
      - MOCK_DELIVERY=true
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/n8n/workflows:/app/n8n/workflows:ro

  # 3. Next.js Frontend Dashboard & Guest Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_HOTEL_NAME=Grand Azure Resort & Hotel
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 4. n8n Workflow Automation Platform
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: hotel_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=AdminHotelN8n2025!
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - FASTAPI_BACKEND_URL=http://backend:8000
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backend/n8n/workflows:/workflows:ro

volumes:
  mysql_data:
  n8n_data:

